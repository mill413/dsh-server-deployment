# Pin the compose project name: it is derived from the compose file's
# directory, and the file now lives in docker/ - without this the project
# would be named "docker" and the named volumes below would be recreated.
name: dsh-server-deployment

services:
  dsh-multitenant:
    image: dsh-server-deployment:local
    build:
      # Context is the repo root: the Dockerfile copies the whole deployment
      # repo into the image. Run everything from the repo root with
      # `docker compose -f docker/compose.yml ...`.
      context: ..
      dockerfile: docker/Dockerfile
      args:
        DSH_BASE_IMAGE: "${DSH_BASE_IMAGE:-dsh-server-base:local}"
    cap_add:
      - NET_ADMIN
    environment:
      COOKIE_SECURE: "0"
      DSH_SKIP_KEY_SETUP: "1"
      # Register/provision accounts immediately, but start each tenant's DSH
      # process only after that user successfully logs in.
      DSH_LAZY_TENANTS: "1"
      # Stop a tenant after its last browser tab closes. pagehide normally
      # stops it after 5s; a 24h heartbeat timeout covers crashes/disconnects
      # without reclaiming processes merely because a browser was suspended.
      DSH_BROWSER_STOP_GRACE_MS: "5000"
      DSH_BROWSER_PRESENCE_TTL_MS: "${DSH_BROWSER_PRESENCE_TTL_MS:-86400000}"
      # Session cookies have a fixed lifetime unless sliding renewal is
      # enabled. Example: TTL 5 days, refresh once per active day.
      SESSION_TTL: "${SESSION_TTL:-43200}"
      SESSION_REFRESH_INTERVAL: "${SESSION_REFRESH_INTERVAL:-0}"
      # Admin-uploaded npm tarballs stay in the persistent gateway state.
      DSH_PLUGIN_TARBALL_DIR: /var/lib/dsh/gateway/plugin-tarballs
      PLUGIN_TARBALL_MAX_MB: "${PLUGIN_TARBALL_MAX_MB:-100}"
      # Disable the public self-service registration page/link. Administrators
      # can still provision accounts with dsh-users or the authenticated API.
      DSH_ENABLE_REGISTER: "0"
      # Admin is a full isolated tenant plus management privileges. It gets an
      # OS account, HOME, port and lazy DSH; the sidebar links its admin panel.
      # The password is scrypt-hashed in users.json.
      DSH_ADMIN_PASSWORD: "${DSH_ADMIN_PASSWORD:-admin-test-password}"
      # External machine-to-machine API token (Bearer). When set, enables:
      #   POST /api/register                 {"username","password"}   -> create user
      #   POST /api/users/<name>/provider    {"provider":{"name","baseURL","model"},"apiKey"} -> register the user's custom provider + key
      #   POST /api/users/<name>/message     {"message","sessionId?","mode?"} -> send a prompt to the user's DSH
      #   GET  /api/users/<name>/sessions    -> list conversation sessions
      #   GET  /api/users/<name>/messages    ?sessionId=... -> read message history
      #   POST /api/users/<name>/files       ?name=...&dir=... -> upload raw file bytes
      # Unset to disable the API entirely.
      DSH_REGISTER_API_KEY: "${DSH_REGISTER_API_KEY:-register-test-token}"
      # Trusted-backend automatic login (LOCAL TEST ONLY). The backend swaps
      # this long-lived Bearer token for a short-lived, one-time browser URL.
      # Production must inject a strong value from a secret store instead.
      DSH_LOGIN_API_KEY: "${DSH_LOGIN_API_KEY:-login-test-token}"
      LOGIN_TICKET_TTL: "${LOGIN_TICKET_TTL:-60}"
      # Single data volume: user homes live under /var/lib/dsh/users and the
      # gateway/supervisor state (users.json, secret, identities) under
      # /var/lib/dsh/gateway - one volume = one backup/cleanup unit.
      DSH_USERS_DIR: /var/lib/dsh/users
      DSH_GATEWAY_STATE_DIR: /var/lib/dsh/gateway
      # Runtime IPC must stay outside the persistent /var/lib/dsh mount.
      DSH_CONTROL_SOCKET: /run/dsh/control.sock
      # Runtime-installed shared bundles live in the persistent /var/lib/dsh
      # tree. Set the host variable to a JSON array of {name,spec}.
      DSH_SHARED_PLUGINS_HOME: /var/lib/dsh/shared-plugins
      DSH_SHARED_WEB_PLUGINS_JSON: "${DSH_SHARED_WEB_PLUGINS_JSON:-[]}"
      # DSH_TENANTS_JSON is a BOOTSTRAP SEED only: these users are created (or
      # updated) when the container starts. To add / remove / change users at
      # runtime without editing this file or recreating the container, use the
      # in-image CLI (persists in the dsh-data volume):
      #
      #   docker compose -f docker/compose.yml exec dsh-multitenant dsh-users add <user> [password]
      #   docker compose -f docker/compose.yml exec dsh-multitenant dsh-users list
      #   docker compose -f docker/compose.yml exec dsh-multitenant dsh-users passwd <user> [password]
      #   docker compose -f docker/compose.yml exec dsh-multitenant dsh-users del <user> [--yes]
      #   docker compose -f docker/compose.yml exec dsh-multitenant dsh-users set-key <user> [key]
      #
      # Removing a user from DSH_TENANTS_JSON does NOT delete a runtime user;
      # use `dsh-users del` for that.
      DSH_TENANTS_JSON: >-
        [{"name":"alice","password":"alice-test-password"},{"name":"bob","password":"bob-test-password"}]
    ports:
      # Bind all host interfaces so the gateway is reachable from the LAN
      # (http://<host-ip>:20810). The gateway injects a crypto.randomUUID
      # fallback into DSH pages, so the web client works on plain-HTTP LAN
      # origins too (browsers hide randomUUID outside secure contexts).
      # Passwords/sessions still travel in clear text - use TLS or a VPN for
      # anything untrusted.
      - "${DSH_GATEWAY_HOST_PORT:-20810}:3100"
    volumes:
      # Everything under one host directory (bind mount): user data + gateway
      # state. Path is relative to this compose file -> docker/data/ on the
      # host, mounted at /var/lib/dsh in the container. Files are directly
      # visible/backup-able on the host.
      - ./data:/var/lib/dsh
    restart: unless-stopped

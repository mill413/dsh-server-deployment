global
  log stdout format raw local0

defaults
  log global
  mode http
  option httplog
  option http-server-close
  timeout connect 10s
  timeout client  24h
  timeout server  24h
  timeout tunnel  24h

resolvers docker
  nameserver dns 127.0.0.11:53
  resolve_retries 3
  timeout resolve 1s
  timeout retry 1s
  hold valid 5s
  hold obsolete 5s

frontend public
  bind *:8080
  http-request del-header X-Forwarded-For
  http-request set-header X-Forwarded-For %[src]
  default_backend dsh_nodes

backend dsh_nodes
  balance roundrobin
  option httpchk GET /__gw/health
  http-check expect status 200
  server-template dsh 16 dsh-multitenant:3100 check resolvers docker init-addr libc,none

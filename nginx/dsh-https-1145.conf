# WebSocket upgrade support (map evaluated at http context)
map $http_upgrade $dsh_conn_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 1145 ssl;
    listen [::]:1145 ssl;
    server_name dsh.example.com;
    http2 on;
    server_tokens off;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:DSHSSL:10m;
    ssl_session_timeout 1d;
    ssl_certificate /usr/local/openresty/nginx/conf/ssl/dsh/fullchain.pem;
    ssl_certificate_key /usr/local/openresty/nginx/conf/ssl/dsh/privkey.pem;
    client_max_body_size 100m;
    error_page 497 =308 https://dsh.example.com:1145$request_uri;

    # NOTE: HSTS recorded on a non-443 port does not apply to default-port
    # visits in most browsers; kept for the clients that honor it, but do
    # not count it as a security control for this deployment.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;

    location / {
        # Keep in sync with the gateway port (units/dsh-gateway.service PORT,
        # gateway default 3100).
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        # Security: OVERWRITE (do not append via $proxy_add_x_forwarded_for)
        # so clients cannot forge the X-Forwarded-For chain. The gateway
        # rate-limits logins by the first XFF segment; an attacker-supplied
        # first segment would bypass IP-level throttling.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $dsh_conn_upgrade;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
